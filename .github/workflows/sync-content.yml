# Keeps the branch the admin panel writes to level with the live branch.
#
# When a developer merges a pull request into `main`, the panel's branch is
# suddenly behind. If it stayed behind, the next panel publish would carry an
# older copy of everything and revert the merge. This fast-forwards `content` so
# the panel is always editing on top of what is live.
#
# It never forces and never merges. There are four possible states and only one
# of them is a write:
#
#   content missing              create it from main
#   content already equals main  nothing to do
#   content behind main          fast-forward it
#   content ahead of main        leave it alone. A publish is in flight or a
#                                previous one failed and its work is still
#                                sitting there unpublished. Overwriting it would
#                                destroy someone's edits.
#   content diverged from main   refuse and open an issue. Resolving this
#                                silently would mean choosing whose work to
#                                discard, which is not a decision to automate.
#
# RECURSION: pushes made with GITHUB_TOKEN do not trigger further workflow runs,
# so the push to `content` here does not re-trigger publish-content.yml. That is
# load-bearing. A merge performed through the GitHub UI is not GITHUB_TOKEN, so
# this workflow does fire for it, which is the case it exists for.
#
# OBSERVED, not assumed. On 10 Sep 2026 both halves of that sentence were seen
# in one event: a UI merge into `main` triggered this workflow, it created
# `content`, and publish-content.yml did not fire on the branch it had just
# created.
#
# TEST LANE: pushing to `proof-main` syncs `proof-content`, mirroring the live
# pair without touching either.

name: Sync content branch

on:
  push:
    branches: [main, proof-main]

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which pair this is
        id: pair
        run: |
          if [ "${GITHUB_REF_NAME}" = "proof-main" ]; then
            echo "content=proof-content" >> "$GITHUB_OUTPUT"
          else
            echo "content=content" >> "$GITHUB_OUTPUT"
          fi

      - name: Fast-forward the panel's branch
        id: sync
        run: |
          CONTENT="${{ steps.pair.outputs.content }}"
          git fetch origin "$CONTENT" || true

          if ! git rev-parse --verify --quiet "origin/${CONTENT}" >/dev/null; then
            echo "${CONTENT} does not exist. Creating it from ${GITHUB_REF_NAME}."
            git push origin "HEAD:refs/heads/${CONTENT}"
            exit 0
          fi

          MAIN_SHA=$(git rev-parse HEAD)
          CONTENT_SHA=$(git rev-parse "origin/${CONTENT}")

          if [ "$MAIN_SHA" = "$CONTENT_SHA" ]; then
            echo "${CONTENT} already matches. Nothing to do."
            exit 0
          fi

          if git merge-base --is-ancestor "origin/${CONTENT}" HEAD; then
            echo "${CONTENT} is behind. Fast-forwarding it to ${MAIN_SHA}."
            git push origin "HEAD:refs/heads/${CONTENT}"
            exit 0
          fi

          if git merge-base --is-ancestor HEAD "origin/${CONTENT}"; then
            echo "${CONTENT} is AHEAD of ${GITHUB_REF_NAME}."
            echo "That is unpublished work from the admin panel, either in flight"
            echo "or left behind by a publish that failed its checks."
            echo "Leaving it alone. It will publish on its own once it passes."
            exit 0
          fi

          echo "::error::${CONTENT} and ${GITHUB_REF_NAME} have diverged."
          {
            echo "DIVERGED"
            echo ""
            echo "  ${GITHUB_REF_NAME} is at  $(git rev-parse --short HEAD)"
            echo "  ${CONTENT} is at  $(git rev-parse --short origin/${CONTENT})"
            echo ""
            echo "Neither is an ancestor of the other, so one of them holds commits"
            echo "the other does not. Moving either would discard work, so nothing"
            echo "was changed."
          } > /tmp/sync-report.txt
          exit 1

      - name: Say so if it could not sync
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT="${{ steps.pair.outputs.content }}"
          BODY=/tmp/issue.md
          {
            echo "**The live site is fine. The admin panel may be out of date.**"
            echo ""
            echo "The \`${CONTENT}\` branch, which the admin panel publishes from, could"
            echo "not be brought level with \`${GITHUB_REF_NAME}\` automatically."
            echo ""
            echo "## What this means for you"
            echo ""
            echo "Nothing on the live site has changed and nothing is broken."
            echo "If you publish from the panel before this is sorted out, your"
            echo "changes may be refused. A developer needs to look at it."
            echo ""
            echo "## Detail for the developer"
            echo ""
            if [ -s /tmp/sync-report.txt ]; then
              sed 's/^/    /' /tmp/sync-report.txt
            else
              echo "    The sync stopped before it could say why."
            fi
            echo ""
            echo "Both branches are intact. Nothing was forced and nothing was merged."
            echo ""
            echo "Full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$BODY"

          gh issue create \
            --title "Admin panel branch is out of step - $(date -u '+%d %b %Y %H:%M') UTC" \
            --body-file "$BODY" \
            --label "publish-blocked" 2>/dev/null \
          || gh issue create \
            --title "Admin panel branch is out of step - $(date -u '+%d %b %Y %H:%M') UTC" \
            --body-file "$BODY"
