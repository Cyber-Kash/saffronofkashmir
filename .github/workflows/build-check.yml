# DO NOT ADD A BRANCH FILTER TO THIS FILE.
#
# `on: [push, pull_request]` with no `branches:` key is load-bearing, not an
# oversight. .github/workflows/publish-content.yml depends on it.
#
# The `main protection` ruleset requires a status check named `verify`, which is
# the job below. Publishing works by pushing to `content`, letting this workflow
# run `verify` against that exact commit, and then fast-forwarding `main` onto
# the same already-verified SHA. That satisfies the required check under the
# rule, which is why nothing in this repository needs a ruleset bypass actor.
#
# Filter this workflow to `main` and no `verify` check is ever produced for a
# `content` commit, so the publish has nothing to satisfy the rule with. The
# server refuses the push in these words, captured from a real refusal on
# 10 Sep 2026:
#
#     remote: error: GH013: Repository rule violations found for refs/heads/main.
#     remote: - Required status check "verify" is expected.
#      ! [remote rejected] HEAD -> main (push declined due to repository rule violations)
#
# None of that is visible to the person publishing. The admin panel writes to
# `content`, succeeds, and says so. Everything looks fine until someone notices
# the live site never changed. publish-content.yml carries a step that waits for
# `verify` and, after 120 seconds with no such check created at all, opens an
# issue naming this file and this comment. That step is the only warning there
# is, so do not remove it either.
#
# The job name below IS the required status check context. Renaming the job
# breaks publishing in exactly the same way and produces the same silence.

name: Build check
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild from source
        run: node build.js
      - name: Fail if output differs from committed files
        run: git add -A && git diff --cached --exit-code
      - name: Fail on junk tokens in generated output
        run: python3 tools/check_output.py
      - name: Fail if a product id does not match its URL segment
        run: python3 tools/check_product_ids.py
      - name: Fail on conflicting values for a tracked figure
        run: python3 tools/check_figures.py
      - name: Fail on an invalid related-post reference
        run: python3 tools/check_related.py
      - name: Fail on an unanchored claim in the purity checker
        run: python3 tools/check_checker.py
